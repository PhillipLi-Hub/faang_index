[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faang-index-api"
version = "1.0.0"
description = "A custom daily market-cap-weighted stock index REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "exchange-calendars>=4.5,<5",
    "tzdata",
]

[tool.setuptools.packages.find]
where = ["src"]
